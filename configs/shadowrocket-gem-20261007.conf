# Shadowrocket GEM profile — 版本 2026-10-07
# 整合 2026-10-07 现役导出配置:全部代理规则统一走 GEM(不再使用 GEMINI 策略)。
# 需要已存在的策略/策略组:GEM;如使用家庭网络访问另需 HOME。
# 修正:3 条 github.com/blob 失效地址改为 raw;truebu 拼写;duia.eu 补 DIRECT;新增 HOME 网段行。

[General]
always-real-ip =
dns-server = https://1.1.1.1/dns-query#proxy=GEM,https://dns.google/dns-query#proxy=GEM
fallback-dns-server = https://1.1.1.1/dns-query#proxy=GEM,https://dns.google/dns-query#proxy=GEM
direct-dns-server = 119.29.29.29
dns-direct-system = false
dns-direct-fallback-proxy = false
bypass-system = true
skip-proxy = 192.168.0.0/16,172.16.0.0/12,localhost,*.local,uag.corp.local,221.239.48.117,artxgeek.dpdns.org,*.artxgeek.dpdns.org,x97geekdorisni.dpdns.org,*.x97geekdorisni.dpdns.org,xgeek.art99.duia.eu
tun-excluded-routes = 100.64.0.0/10,127.0.0.0/8,169.254.0.0/16,172.16.0.0/12,192.0.0.0/24,192.0.2.0/24,192.88.99.0/24,192.168.0.0/16,198.51.100.0/24,203.0.113.0/24,224.0.0.0/4,255.255.255.255/32,239.255.255.250/32
hijack-dns = 8.8.8.8:53,8.8.4.4:53,1.1.1.1:53,1.0.0.1:53,9.9.9.9:53,149.112.112.112:53,208.67.222.222:53,208.67.220.220:53
icmp-auto-reply = true
udp-policy-not-supported-behaviour = REJECT
# block-quic = all-proxy
ipv6 = false
prefer-ipv6 = false
private-ip-answer = true

[Rule]

# 1. 节点、局域网与 DDNS（最高优先级）
DOMAIN-SUFFIX,raksmart.com,DIRECT
DOMAIN-SUFFIX,artxgeek.dpdns.org,DIRECT
DOMAIN-SUFFIX,x97geekdorisni.dpdns.org,DIRECT
# 与 skip-proxy 中的 DDNS 条目配对，防止本地代理访问自身节点形成回环。
DOMAIN-SUFFIX,xgeek.art99.duia.eu,DIRECT
DOMAIN-SUFFIX,dorisw.kdns.fr,DIRECT
DOMAIN-SUFFIX,corp.local,DIRECT

# 拦截微信/支付宝/京东等 App 内置 DoH，强制 DNS 回到上方 proxied DoH 路径。
